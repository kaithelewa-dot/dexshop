<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Админ-панель — Dex Shop</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Playfair+Display:wght@600&display=swap" rel="stylesheet">
<style>
:root{--bg:#f5f3ef;--ink:#141414;--ink2:#3d3d3d;--mute:#7b776f;--line:#e4dfd6;--dark:#111;--r:20px;--serif:'Playfair Display',Georgia,serif;--sans:'Manrope',system-ui,sans-serif}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--sans);background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased;overflow-x:hidden}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
a{color:inherit}
svg{display:block}
.wrap{max-width:1200px;margin:0 auto;padding:0 24px}
.logo{display:flex;flex-direction:column;line-height:1;text-decoration:none}
.logo b{font-family:var(--serif);font-size:22px;letter-spacing:.14em;font-weight:600;white-space:nowrap}
.logo small{font-size:9px;letter-spacing:.36em;color:#8d877c;margin-top:5px;font-weight:700}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;background:var(--ink);color:#fff;font-size:12px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;padding:14px 22px;border-radius:40px;transition:.2s;text-decoration:none}
.btn:hover{opacity:.9}
.btn.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--ink)}
.btn.light{background:#fff;color:var(--ink)}
.btn.wa{background:#1fa855}
.btn.sm{padding:9px 14px;font-size:10.5px}
.btn[disabled]{opacity:.5;pointer-events:none}
input,select,textarea{width:100%;font-size:15px;padding:12px 14px;border-radius:12px;border:1.5px solid #e2ded6;background:#fff;outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--ink)}
label.l{display:block;font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;font-weight:800;color:var(--mute);margin-bottom:6px}

/* login */
.center{min-height:100vh;display:grid;place-items:center;padding:24px}
.login{background:#fff;border-radius:28px;padding:38px 32px;width:100%;max-width:400px;box-shadow:0 30px 60px -40px rgba(0,0,0,.35)}
.login h1{font-family:var(--serif);font-size:30px;margin:22px 0 6px;font-weight:600}
.login p{color:var(--mute);font-size:14px;margin-bottom:22px;line-height:1.5}
.login form{display:flex;flex-direction:column;gap:12px}
.err{color:#b4442c;font-size:13px;min-height:18px}

/* panel */
.top{background:var(--dark);color:#fff;position:sticky;top:0;z-index:20}
.top .wrap{display:flex;align-items:center;justify-content:space-between;height:66px;gap:12px}
.top .logo b{color:#fff}
.top .r{display:flex;gap:8px;align-items:center}
.top .who{font-size:12px;color:#aaa;max-width:200px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tabs{display:flex;gap:6px;background:#fff;padding:5px;border-radius:40px;border:1px solid var(--line);margin:24px 0 18px;width:max-content;max-width:100%;overflow-x:auto;scrollbar-width:none}
.tab{font-size:12.5px;font-weight:800;padding:10px 16px;border-radius:30px;color:var(--ink2);white-space:nowrap;display:flex;gap:7px;align-items:center}
.tab.on{background:var(--ink);color:#fff}
.tab .cnt{background:#e0473a;color:#fff;border-radius:10px;font-size:10px;padding:2px 6px;min-width:18px;text-align:center}
.card{background:#fff;border-radius:var(--r);padding:22px;margin-bottom:14px}
.card h3{font-size:19px;font-weight:800;margin-bottom:6px}
.note{font-size:13.5px;color:var(--mute);line-height:1.6;margin-bottom:14px}

.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-bottom:14px}
.stat{background:#fff;border-radius:18px;padding:18px}
.stat small{display:block;font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--mute);font-weight:800;margin-bottom:6px}
.stat b{font-size:26px;font-weight:800;letter-spacing:-.02em}
.stat.dark{background:var(--dark);color:#fff}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.chip{font-size:12px;font-weight:800;padding:8px 14px;border-radius:20px;background:#fff;border:1.5px solid transparent}
.chip.on{border-color:var(--ink)}
.search{max-width:320px;margin-bottom:14px}
.order{background:#fff;border-radius:var(--r);padding:20px;margin-bottom:12px;display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr) auto;gap:20px;align-items:start;border-left:5px solid transparent;animation:in .4s both}
@keyframes in{from{opacity:0;transform:translateY(8px)}}
.order.s-new{border-left-color:#e0473a}
.order.s-confirmed{border-left-color:#e3a32b}
.order.s-shipping{border-left-color:#3b7be0}
.order.s-done{border-left-color:#1f8a4c;opacity:.85}
.order.s-cancel{border-left-color:#aaa;opacity:.6}
.order .num{font-size:17px;font-weight:800}
.order .date{font-size:12px;color:var(--mute);margin-top:2px}
.order ul{list-style:none;margin:12px 0 0;font-size:13.5px;line-height:1.6}
.order ul li span{color:var(--mute)}
.order .tot{font-size:20px;font-weight:800;margin-top:10px}
.order .cust{font-size:13.5px;line-height:1.7}
.order .cust b{font-size:15px}
.order .cust .m{color:var(--mute)}
.order .act{display:flex;flex-direction:column;gap:8px;min-width:170px}
.order select{padding:10px 12px;font-weight:700;font-size:13px}
.del{font-size:12px;color:#b4442c;text-decoration:underline;padding:4px}
.empty{text-align:center;color:var(--mute);padding:50px 10px;background:#fff;border-radius:var(--r)}
.badge-new{display:inline-block;background:#e0473a;color:#fff;font-size:10px;font-weight:800;letter-spacing:.08em;padding:3px 8px;border-radius:10px;margin-left:8px;vertical-align:middle}

.prow{display:grid;grid-template-columns:84px minmax(0,1.4fr) minmax(0,.7fr) minmax(0,.7fr) minmax(0,1.7fr) auto;gap:14px;align-items:center;padding:16px 0;border-bottom:1px solid var(--line)}
.prow:last-child{border-bottom:0}
.prow .th{width:84px;height:84px;border-radius:14px;background:var(--bg);display:grid;place-items:center;overflow:hidden}
.prow .th svg,.prow .th img{width:86%;height:86%;object-fit:contain}
.prow .nm b{display:block;font-size:14px}
.prow .nm small{color:var(--mute);font-size:12px}
.phs{display:flex;gap:8px;flex-wrap:wrap}
.ph{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:10px;color:var(--mute);font-weight:700;width:60px;text-align:center}
.ph .slot{width:54px;height:54px;border-radius:12px;border:1.5px dashed #cfc9be;display:grid;place-items:center;overflow:hidden;cursor:pointer;position:relative;background:var(--bg)}
.ph .slot img{width:100%;height:100%;object-fit:cover}
.ph .slot i{position:absolute;bottom:3px;right:3px;width:12px;height:12px;border-radius:50%;box-shadow:0 0 0 2px #fff}
.ph .slot.busy{opacity:.4}
.ph input{display:none}
.ph .rm{font-size:10px;color:#b4442c;text-decoration:underline}
.ph span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;width:100%}
.save{font-size:11px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;background:var(--ink);color:#fff;padding:12px 16px;border-radius:30px;white-space:nowrap}
.save.ok{background:#1f8a4c}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.msg{font-size:13px;color:var(--mute);margin-top:10px;min-height:18px}
.heroph{display:flex;gap:16px;align-items:center;flex-wrap:wrap}
.heroph .slot{width:120px;height:160px;border-radius:16px;border:1.5px dashed #cfc9be;background:var(--bg);display:grid;place-items:center;overflow:hidden;cursor:pointer;font-size:12px;color:var(--mute);text-align:center;padding:6px}
.heroph .slot img{width:100%;height:100%;object-fit:contain}
.toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,140px);background:var(--ink);color:#fff;padding:13px 20px;border-radius:30px;font-size:13.5px;font-weight:700;z-index:50;transition:transform .35s;max-width:calc(100% - 32px)}
.toast.show{transform:translate(-50%,0)}

@media (max-width:900px){
  .wrap{padding:0 14px}
  .stats{grid-template-columns:repeat(2,minmax(0,1fr))}
  .order{grid-template-columns:minmax(0,1fr);gap:12px}
  .order .act{flex-direction:row;flex-wrap:wrap;min-width:0}
  .order .act select{flex:1 1 100%}
  .prow{grid-template-columns:70px minmax(0,1fr) minmax(0,1fr);gap:10px}
  .prow .th{width:70px;height:70px;grid-row:span 2}
  .prow .nm{grid-column:2/-1}
  .prow .phs-cell,.prow .save-cell{grid-column:1/-1}
  .save{width:100%}
  .grid2{grid-template-columns:minmax(0,1fr)}
  .top .who{display:none}
  .search{max-width:none}
}
</style>
</head>
<body>
<div id="root"><div class="center" style="color:#7b776f">Загрузка…</div></div>
<div class="toast" id="toast"></div>

<script src="firebase-config.js"></script>
<script src="data.js"></script>
<script type="module">
import {configured,app,db,doc,collection,query,orderBy,limit,onSnapshot,setDoc,updateDoc,deleteDoc} from './firebase.js';
import {getAuth,signInWithEmailAndPassword,onAuthStateChanged,signOut,sendPasswordResetEmail} from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js';

const root=document.getElementById('root');
const LOGO='<span class="logo"><b>DEX SHOP</b><small>АДМИН-ПАНЕЛЬ</small></span>';
let tt;function toast(t){const el=document.getElementById('toast');el.textContent=t;el.classList.add('show');clearTimeout(tt);tt=setTimeout(()=>el.classList.remove('show'),2600);}

if(!configured){
  root.innerHTML=`<div class="center"><div class="login">${LOGO}<h1>Почти готово</h1><p>Админ-панель ещё не подключена к базе. Откройте файл <b>firebase-config.js</b> и вставьте настройки Firebase — как в инструкции, шаг 5.</p><a class="btn ghost" href="index.html">На сайт</a></div></div>`;
  throw new Error('not configured');
}
const auth=getAuth(app);

/* ---------------- login ---------------- */
function showLogin(){
  root.innerHTML=`<div class="center"><div class="login">${LOGO}<h1>Вход</h1><p>Только для администратора магазина.</p>
  <form id="lf"><input type="email" name="email" placeholder="E-mail" required autocomplete="username"><input type="password" name="pass" placeholder="Пароль" required autocomplete="current-password">
  <div class="err" id="lerr"></div><button class="btn" type="submit">Войти</button>
  <button class="del" type="button" id="forgot" style="align-self:center">Забыли пароль?</button></form>
  <div style="margin-top:18px;text-align:center"><a href="index.html" style="font-size:13px;color:#7b776f">← Вернуться в магазин</a></div></div></div>`;
  const f=document.getElementById('lf');
  f.onsubmit=async e=>{e.preventDefault();const b=f.querySelector('[type=submit]');b.disabled=true;document.getElementById('lerr').textContent='';
    try{await signInWithEmailAndPassword(auth,f.email.value.trim(),f.pass.value);}
    catch(err){document.getElementById('lerr').textContent=/invalid|wrong|not-found|credential/.test(err.code||'')?'Неверный e-mail или пароль':(err.code==='auth/too-many-requests'?'Слишком много попыток, подождите немного':'Ошибка входа: '+(err.code||err.message));b.disabled=false;}};
  document.getElementById('forgot').onclick=async()=>{const em=f.email.value.trim();if(!em){document.getElementById('lerr').textContent='Введите e-mail выше';return;}
    try{await sendPasswordResetEmail(auth,em);document.getElementById('lerr').textContent='Письмо для сброса пароля отправлено';}catch(_){document.getElementById('lerr').textContent='Не удалось отправить письмо';}};
}

/* ---------------- state ---------------- */
let unsubs=[], ORDERS=[], OVR={}, PHOTOS={}, SHOP={}, tab='orders', fStatus='all', search='', firstOrders=true, knownNew=new Set(), userEmail='';
const STATUSES=[['new','Новый'],['confirmed','Подтверждён'],['shipping','Доставляется'],['done','Выполнен'],['cancel','Отменён']];
const stName=k=>(STATUSES.find(s=>s[0]===k)||['','—'])[1];
const vis=(p,c=0)=>{const ph=PHOTOS[p.id]||{};const u=safeUrl(ph[c]||ph[0]||'');return u?`<img src="${esc(u)}" alt="">`:p.draw(p.colors[c]?.[1]||p.colors[0][1]);};
const priceOf=p=>{const v=OVR[p.id]?.price;return (typeof v==='number'&&v>0)?v:p.price};
const oldOf=p=>{const o=OVR[p.id];if(o&&'old' in o)return (typeof o.old==='number'&&o.old>0)?o.old:0;return p.old||0};
const digits=s=>String(s||'').replace(/\D/g,'');
const fmtDate=ts=>{if(!ts||!ts.toDate)return 'только что';const d=ts.toDate();return d.toLocaleDateString('ru-RU',{day:'2-digit',month:'2-digit',year:'numeric'})+' '+d.toLocaleTimeString('ru-RU',{hour:'2-digit',minute:'2-digit'});};

function beep(){try{const a=new (window.AudioContext||window.webkitAudioContext)();[0,.18].forEach(t=>{const o=a.createOscillator(),g=a.createGain();o.frequency.value=880;o.connect(g);g.connect(a.destination);g.gain.setValueAtTime(.18,a.currentTime+t);g.gain.exponentialRampToValueAtTime(.001,a.currentTime+t+.16);o.start(a.currentTime+t);o.stop(a.currentTime+t+.17);});}catch(_){}}

function startPanel(user){
  userEmail=user.email||'';
  const err=e=>{console.warn(e);if(e.code==='permission-denied')root.innerHTML=`<div class="center"><div class="login">${LOGO}<h1>Нет доступа</h1><p>Аккаунт <b>${esc(userEmail)}</b> не указан как администратор в правилах базы (firestore.rules). Проверьте e-mail в правилах — шаг 3 инструкции.</p><button class="btn" id="lo2">Выйти</button></div></div>`,document.getElementById('lo2').onclick=()=>signOut(auth);};
  unsubs.push(onSnapshot(query(collection(db,'orders'),orderBy('createdAt','desc'),limit(300)),qs=>{
    ORDERS=qs.docs.map(d=>({id:d.id,...d.data()}));
    const nowNew=ORDERS.filter(o=>o.status==='new').map(o=>o.id);
    if(!firstOrders&&nowNew.some(id=>!knownNew.has(id))){beep();toast('🛍 Новый заказ!');}
    knownNew=new Set(nowNew);firstOrders=false;
    document.title=(nowNew.length?`(${nowNew.length}) `:'')+'Админ-панель — Dex Shop';
    if(tab==='orders')render();else renderTabs();
  },err));
  unsubs.push(onSnapshot(doc(db,'config','products'),s=>{OVR=s.exists()?s.data():{};if(tab!=='products')render();},err));
  unsubs.push(onSnapshot(collection(db,'photos'),qs=>{const m={};qs.forEach(d=>{const x=d.data();(m[x.pid]=m[x.pid]||{})[x.c]=x.data;});PHOTOS=m;if(tab==='products'||tab==='contacts')render(true);},err));
  unsubs.push(onSnapshot(doc(db,'config','shop'),s=>{SHOP=Object.assign({},window.SHOP_DEFAULTS||{},s.exists()?s.data():{});if(tab==='contacts')render();},err));
  render();
}

/* ---------------- render ---------------- */
function shell(){
  if(document.getElementById('panel'))return;
  root.innerHTML=`<div class="top"><div class="wrap">${LOGO}<div class="r"><span class="who">${esc(userEmail)}</span><a class="btn light sm" href="index.html" target="_blank">Сайт</a><button class="btn light sm" id="lo">Выйти</button></div></div></div>
  <div class="wrap" id="panel"><div class="tabs" id="tabs"></div><div id="view"></div></div>`;
  document.getElementById('lo').onclick=()=>{unsubs.forEach(u=>u());unsubs=[];signOut(auth);};
}
function renderTabs(){
  const n=ORDERS.filter(o=>o.status==='new').length;
  document.getElementById('tabs').innerHTML=[['orders','Заказы'],['products','Товары и фото'],['contacts','Контакты']].map(([k,t])=>`<button class="tab ${k===tab?'on':''}" data-tab="${k}">${t}${k==='orders'&&n?`<span class="cnt">${n}</span>`:''}</button>`).join('');
}
function render(soft){
  shell();renderTabs();
  const v=document.getElementById('view');
  if(tab==='orders')v.innerHTML=ordersView();
  if(tab==='products'){if(soft&&document.querySelector('.prow')){refreshPhotos();return;}v.innerHTML=productsView();}
  if(tab==='contacts'){if(soft&&document.getElementById('sf')){refreshHero();return;}v.innerHTML=contactsView();}
}
function ordersView(){
  const today=new Date();today.setHours(0,0,0,0);
  const todays=ORDERS.filter(o=>o.createdAt?.toDate&&o.createdAt.toDate()>=today&&o.status!=='cancel');
  const cnt=k=>ORDERS.filter(o=>o.status===k).length;
  let list=ORDERS.filter(o=>fStatus==='all'||o.status===fStatus);
  if(search){const q=search.toLowerCase();list=list.filter(o=>[o.num,o.name,o.phone,o.addr].join(' ').toLowerCase().includes(q));}
  return `<div class="stats">
    <div class="stat dark"><small>Новые</small><b>${cnt('new')}</b></div>
    <div class="stat"><small>В работе</small><b>${cnt('confirmed')+cnt('shipping')}</b></div>
    <div class="stat"><small>Заказов сегодня</small><b>${todays.length}</b></div>
    <div class="stat"><small>Сумма сегодня</small><b>${som(todays.reduce((s,o)=>s+(+o.total||0),0))}</b></div></div>
  <div class="chips">${[['all','Все ('+ORDERS.length+')'],...STATUSES.map(([k,n])=>[k,n+' ('+cnt(k)+')'])].map(([k,n])=>`<button class="chip ${k===fStatus?'on':''}" data-fs="${k}">${n}</button>`).join('')}</div>
  <input class="search" id="search" placeholder="Поиск: номер, имя, телефон" value="${esc(search)}">
  <div id="olist">${list.length?list.map(orderCard).join(''):`<div class="empty">${ORDERS.length?'Нет заказов с таким фильтром':'Заказов пока нет. Когда покупатель оформит заказ на сайте, он сразу появится здесь со звуковым сигналом.'}</div>`}</div>`;
}
function orderCard(o){
  const items=Array.isArray(o.items)?o.items:[];
  const ph=digits(o.phone);
  const waText=`Здравствуйте, ${o.name||''}! Это Dex Shop. Ваш заказ ${o.num||''} на сумму ${som(+o.total||0)} принят.`;
  return `<div class="order s-${esc(o.status)}" data-id="${esc(o.id)}">
    <div><div class="num">${esc(o.num||'Заказ')}${o.status==='new'?'<span class="badge-new">НОВЫЙ</span>':''}</div><div class="date">${fmtDate(o.createdAt)}</div>
      <ul>${items.map(it=>`<li>${esc(it.name)} <span>· ${esc(it.variant||'')} × ${+it.qty||1}</span> — ${som(+it.sum||0)}</li>`).join('')}</ul>
      <div class="tot">${som(+o.total||0)}</div></div>
    <div class="cust"><b>${esc(o.name)}</b><br><a href="tel:${esc(o.phone)}">${esc(o.phone)}</a><br>
      <span class="m">Город:</span> ${esc(o.city)}<br><span class="m">Получение:</span> ${esc(o.delivery)}<br>
      ${o.addr?`<span class="m">Адрес:</span> ${esc(o.addr)}<br>`:''}<span class="m">Оплата:</span> ${esc(o.pay)}<br>
      <span class="m">${esc(o.wrap)}</span>${o.note?`<br><span class="m">Комментарий:</span> ${esc(o.note)}`:''}</div>
    <div class="act"><select data-status>${STATUSES.map(([k,n])=>`<option value="${k}" ${k===o.status?'selected':''}>${n}</option>`).join('')}</select>
      ${ph?`<a class="btn wa sm" href="https://wa.me/${ph}?text=${encodeURIComponent(waText)}" target="_blank" rel="noopener">WhatsApp клиенту</a>`:''}
      <button class="del" data-del>Удалить</button></div></div>`;
}
function productsView(){
  return `<div class="card"><h3>Товары, цены и фотографии</h3><p class="note">Загрузите реальные фото — лучше PNG или JPG на белом/прозрачном фоне. Для каждого цвета своё фото; если фото для цвета нет, на сайте покажется первое. Фото автоматически уменьшаются. Цены — в сомах; «Старая цена» — зачёркнутая цена скидки (оставьте пустой, если скидки нет).</p>
  ${P.map(p=>`<div class="prow" data-pid="${p.id}">
    <div class="th">${vis(p,0)}</div>
    <div class="nm"><b>${p.name}</b><small>${(CATS.find(c=>c[0]===p.cat)||[])[1]} · ${p.brand}</small></div>
    <div><label class="l">Цена</label><input type="number" min="0" step="10" data-f="price" value="${priceOf(p)}"></div>
    <div><label class="l">Старая цена</label><input type="number" min="0" step="10" data-f="old" value="${oldOf(p)||''}"></div>
    <div class="phs-cell"><label class="l">Фото по цветам</label><div class="phs">${p.colors.map((c,i)=>photoSlot(p,i,c)).join('')}</div></div>
    <div class="save-cell"><button class="save" data-save>Сохранить цену</button></div></div>`).join('')}</div>`;
}
function photoSlot(p,i,c){const u=safeUrl((PHOTOS[p.id]||{})[i]);return `<div class="ph" data-c="${i}"><label class="slot">${u?`<img src="${esc(u)}" alt="">`:'<svg width="18" height="18" fill="none" stroke="#9a9488" stroke-width="1.6"><path d="M9 3v12M3 9h12"/></svg>'}<i style="background:${c[1]}"></i><input type="file" accept="image/*" data-up="${i}"></label><span title="${esc(c[0])}">${esc(c[0])}</span>${u?`<button class="rm" data-rm="${i}">удалить</button>`:''}</div>`;}
function refreshPhotos(){document.querySelectorAll('.prow').forEach(r=>{const p=byId[r.dataset.pid];r.querySelector('.th').innerHTML=vis(p,0);r.querySelector('.phs').innerHTML=p.colors.map((c,i)=>photoSlot(p,i,c)).join('');});}
function heroSlot(){const hp=safeUrl((PHOTOS.hero||{})[0]);return `<label class="slot">${hp?`<img src="${esc(hp)}" alt="">`:'Нажмите, чтобы загрузить'}<input type="file" accept="image/*" id="heroUp" style="display:none"></label>${hp?'<button class="btn ghost sm" id="heroRm">Вернуть нарисованный телефон</button>':''}`;}
function refreshHero(){const h=document.getElementById('heroBox');if(h)h.innerHTML=heroSlot();}
function contactsView(){
  const f=[['phone','Телефон'],['whatsapp','WhatsApp (только цифры, с 996)'],['email','E-mail'],['address','Адрес'],['hours','Часы работы'],['instagram','Instagram (без @)'],['telegram','Telegram (без @)']];
  return `<div class="card"><h3>Контакты магазина</h3><p class="note">Показываются на сайте в подвале и в мобильном меню. Номер WhatsApp используется для кнопки «Написать в WhatsApp» у покупателя.</p>
  <form id="sf"><div class="grid2">${f.map(([k,n])=>`<div><label class="l">${n}</label><input name="${k}" value="${esc(SHOP[k])}"></div>`).join('')}</div>
  <button class="btn" style="margin-top:16px">Сохранить контакты</button><div class="msg" id="smsg"></div></form></div>
  <div class="card"><h3>Фото на главном экране</h3><p class="note">Вместо нарисованного Galaxy S24 Ultra можно поставить реальное фото (задняя сторона телефона). Лучше всего — вертикальный PNG без фона. Фото тоже будет поворачиваться за мышкой.</p>
  <div class="heroph" id="heroBox">${heroSlot()}</div><div class="msg" id="hmsg"></div></div>`;
}

/* ---------------- images ---------------- */
async function resizeImage(file,max=900){
  const url=URL.createObjectURL(file);
  try{
    const img=await new Promise((res,rej)=>{const i=new Image();i.onload=()=>res(i);i.onerror=()=>rej(new Error('bad image'));i.src=url;});
    let w=img.naturalWidth,h=img.naturalHeight;const k=Math.min(1,max/Math.max(w,h));w=Math.round(w*k);h=Math.round(h*k);
    const cv=document.createElement('canvas');cv.width=w;cv.height=h;cv.getContext('2d').drawImage(img,0,0,w,h);
    for(const q of [.86,.76,.62,.48]){const d=cv.toDataURL('image/webp',q);if(d.startsWith('data:image/webp')&&d.length<850000)return d;}
    const png=cv.toDataURL('image/png');if(png.length<850000)return png;
    for(const q of [.8,.6,.45]){const d=cv.toDataURL('image/jpeg',q);if(d.length<850000)return d;}
    throw new Error('too big');
  }finally{URL.revokeObjectURL(url);}
}
async function savePhoto(pid,c,file){const data=await resizeImage(file,pid==='hero'?1100:900);await setDoc(doc(db,'photos',`${pid}_${c}`),{pid,c:+c,data,updatedAt:Date.now()});}

/* ---------------- events ---------------- */
root.addEventListener('click',async e=>{
  const t=e.target.closest('[data-tab]');if(t){tab=t.dataset.tab;document.getElementById('view').innerHTML='';render();return;}
  const fs=e.target.closest('[data-fs]');if(fs){fStatus=fs.dataset.fs;render();return;}
  const del=e.target.closest('[data-del]');
  if(del){const id=del.closest('.order').dataset.id;
    if(del.dataset.sure){try{await deleteDoc(doc(db,'orders',id));toast('Заказ удалён');}catch(_){toast('Не удалось удалить');}}
    else{del.dataset.sure='1';del.textContent='Точно удалить? Нажмите ещё раз';setTimeout(()=>{if(del.isConnected){delete del.dataset.sure;del.textContent='Удалить';}},3500);}
    return;}
  const sv=e.target.closest('[data-save]');
  if(sv){const r=sv.closest('.prow'),id=r.dataset.pid,p=byId[id];const pr=+r.querySelector('[data-f=price]').value,od=+r.querySelector('[data-f=old]').value;
    sv.textContent='Сохраняю…';
    try{await setDoc(doc(db,'config','products'),{[id]:{price:pr>0?pr:p.price,old:od>0?od:0}},{merge:true});sv.textContent='Сохранено ✓';sv.classList.add('ok');}
    catch(_){sv.textContent='Ошибка';toast('Не удалось сохранить');}
    setTimeout(()=>{sv.textContent='Сохранить цену';sv.classList.remove('ok');},1800);return;}
  const rm=e.target.closest('[data-rm]');
  if(rm){e.preventDefault();const id=rm.closest('.prow').dataset.pid;try{await deleteDoc(doc(db,'photos',`${id}_${rm.dataset.rm}`));toast('Фото удалено');}catch(_){toast('Не удалось удалить');}return;}
  if(e.target.id==='heroRm'){try{await deleteDoc(doc(db,'photos','hero_0'));toast('Готово');}catch(_){toast('Не удалось удалить');}}
});
root.addEventListener('change',async e=>{
  const el=e.target;
  if(el.matches('[data-status]')){const id=el.closest('.order').dataset.id;try{await updateDoc(doc(db,'orders',id),{status:el.value});toast('Статус: '+stName(el.value));}catch(_){toast('Не удалось изменить статус');}}
  if(el.matches('[data-up]')&&el.files[0]){const id=el.closest('.prow').dataset.pid;const slot=el.closest('.slot');slot.classList.add('busy');toast('Загружаю фото…');
    try{await savePhoto(id,el.dataset.up,el.files[0]);toast('Фото сохранено — уже на сайте');}catch(err){slot.classList.remove('busy');toast(err.message==='too big'?'Фото слишком большое':'Не удалось загрузить фото');}}
  if(el.id==='heroUp'&&el.files[0]){const m=document.getElementById('hmsg');m.textContent='Загружаю…';
    try{await savePhoto('hero',0,el.files[0]);m.textContent='Сохранено ✓';}catch(_){m.textContent='Не удалось загрузить фото';}}
});
root.addEventListener('input',e=>{if(e.target.id==='search'){search=e.target.value;const pos=e.target.selectionStart;render();const s=document.getElementById('search');s.focus();s.setSelectionRange(pos,pos);}});
root.addEventListener('submit',async e=>{
  if(e.target.id!=='sf')return;e.preventDefault();
  const fd=Object.fromEntries(new FormData(e.target).entries());fd.whatsapp=digits(fd.whatsapp);
  const m=document.getElementById('smsg');m.textContent='Сохраняю…';
  try{await setDoc(doc(db,'config','shop'),fd,{merge:true});m.textContent='Сохранено ✓ — уже на сайте';}catch(_){m.textContent='Не удалось сохранить';}
});

onAuthStateChanged(auth,u=>{unsubs.forEach(x=>x());unsubs=[];firstOrders=true;if(u)startPanel(u);else showLogin();});
